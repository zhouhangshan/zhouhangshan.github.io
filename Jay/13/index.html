                    else if(type==='shovel'){ for(let y=2;y<7;y++)for(let x=5;x<11;x++) this.px(ctx,x,y,color); this.px(ctx,5,2,color); this.px(ctx,10,2,color); }
                    else if(type==='sword'){ for(let y=2;y<9;y++){ this.px(ctx,6,y,color); this.px(ctx,7,y,color); this.px(ctx,8,y,color); } this.px(ctx,6,8,color); this.px(ctx,8,8,color); this.px(ctx,5,8,color); this.px(ctx,9,8,color); this.px(ctx,6,2,color); this.px(ctx,8,2,color); }
                }
            }
            px(ctx,x,y,color){ ctx.fillStyle=color; ctx.fillRect(x,y,1,1); }

            // ---- 物品栏操作 ----
            itemStack(id){ return {id:id, count:0}; }
            getStackMax(id){ return ITEMS[id].stack; }
            // 尝试加入物品（先光标，再背包），返回是否全部放入
            addItem(id, count){
                let remaining=count;
                const put=(slot)=>{ if(remaining<=0) return 0; if(slot===null){ const take=Math.min(remaining,this.getStackMax(id)); slot={id:id,count:take}; remaining-=take; return take; } if(slot.id===id){ const space=this.getStackMax(id)-slot.count; const take=Math.min(remaining,space); slot.count+=take; remaining-=take; return take; } return 0; };
                if(this.cursor){ const c=this.cursor; if(c.id===id){ put(c); } }
                if(remaining>0){
                    // 先合并已有，再填空位
                    for(let i=0;i<36;i++){ const s=this.inventory[i]; if(s&&s.id===id) put(s); if(remaining<=0) break; }
                    for(let i=0;i<36;i++){ if(remaining<=0) break; if(this.inventory[i]===null){ const take=Math.min(remaining,this.getStackMax(id)); this.inventory[i]={id:id,count:take}; remaining-=take; } }
                }
                if(remaining<count){ this.renderHotbar(); this.renderInventory(); this.renderCursor(); }
                return remaining===0;
            }
            removeSelected(count){
                const s=this.inventory[this.selectedSlot]; if(!s) return;
                s.count-=count;
                if(s.count<=0){ this.inventory[this.selectedSlot]=null; }
                this.renderHotbar(); this.renderInventory();
            }
            getSelected(){ return this.inventory[this.selectedSlot]; }

            // ---- UI ----
            initUI(){
                document.getElementById('hotbar').innerHTML='';
            }
            renderSlot(el, item, isHotbar, idx){
                el.innerHTML='';
                el.classList.toggle('active', isHotbar && idx===this.selectedSlot);
                if(item){
                    const img=document.createElement('img'); img.src=this.getIconURL(item.id); img.draggable=false;
                    el.appendChild(img);
                    if(item.count>1){ const c=document.createElement('span'); c.className='count'; c.textContent=item.count; el.appendChild(c); }
                    const def=ITEMS[item.id];
                    if(def.type==='tool'){
                        const cur=item.dur!=null?item.dur:def.durability;
                        const d=document.createElement('div'); d.className='dur';
                        const fill=document.createElement('div'); fill.style.width=Math.max(0,cur/def.durability*100)+'%'; d.appendChild(fill);
                        el.appendChild(d);
                    }
                }
            }
            renderHotbar(){
                const hb=document.getElementById('hotbar'); hb.innerHTML='';
                for(let i=0;i<9;i++){
                    const slot=document.createElement('div'); slot.className='slot'; slot.dataset.i=i;
                    this.renderSlot(slot, this.inventory[i], true, i);
                    slot.addEventListener('click',(e)=>{ e.stopPropagation(); this.selectSlot(i); });
                    slot.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.selectSlot(i); },{passive:false});
                    hb.appendChild(slot);
                }
                this.updateSelectedName();
            }
            renderInventory(){
                const grid=document.getElementById('inv-grid'); if(!grid) return;
                grid.innerHTML='';
                for(let i=9;i<36;i++){
                    const slot=document.createElement('div'); slot.className='slot'; slot.dataset.i=i;
                    this.renderSlot(slot, this.inventory[i], false, i);
                    slot.addEventListener('click',(e)=>{ e.stopPropagation(); this.slotClick(i); });
                    slot.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.slotClick(i); },{passive:false});
                    grid.appendChild(slot);
                }
                // 快捷栏（面板内）
                const hb=document.getElementById('inv-hotbar'); if(!hb) return;
                hb.innerHTML='';
                for(let i=0;i<9;i++){
                    const slot=document.createElement('div'); slot.className='slot'; slot.dataset.i=i;
                    this.renderSlot(slot, this.inventory[i], true, i);
                    slot.addEventListener('click',(e)=>{ e.stopPropagation(); this.slotClick(i); });
                    slot.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.slotClick(i); },{passive:false});
                    hb.appendChild(slot);
                }
            }
            renderCraft(){
                const grid=document.getElementById('craft-grid');
                grid.className='craft-grid '+(this.craftSize===2?'g2':'g3');
                grid.innerHTML='';
                const n=this.craftSize*this.craftSize;
                for(let i=0;i<n;i++){
                    const slot=document.createElement('div'); slot.className='slot'; slot.dataset.i=i;
                    this.renderSlot(slot, this.craftSlots[i], false, i);
                    slot.addEventListener('click',(e)=>{ e.stopPropagation(); this.craftSlotClick(i); });
                    slot.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.craftSlotClick(i); },{passive:false});
                    grid.appendChild(slot);
                }
                this.renderResult();
            }
            renderResult(){
                const res=document.getElementById('craft-result'); res.innerHTML='';
                const rec=this.getRecipe();
                if(rec){
                    const img=document.createElement('img'); img.src=this.getIconURL(rec.out);
                    res.appendChild(img);
                    if(rec.count>1){ const c=document.createElement('span'); c.className='count'; c.textContent=rec.count; res.appendChild(c); }
                }
            }
            getRecipe(){
                const grid=this.craftSlots.slice(0,this.craftSize*this.craftSize);
                return matchRecipe(grid, this.craftSize);
            }
            renderCursor(){
                // 光标物品显示在准星附近（简单起见，桌面跟随鼠标，触屏显示在面板）
                const badge=document.getElementById('cursor-badge');
                if(!badge) return;
                if(this.cursor){
                    badge.style.display='flex'; badge.innerHTML='';
                    const img=document.createElement('img'); img.src=this.getIconURL(this.cursor.id);
                    badge.appendChild(img);
                    if(this.cursor.count>1){ const c=document.createElement('span'); c.className='count'; c.textContent=this.cursor.count; badge.appendChild(c); }
                } else badge.style.display='none';
            }
            updateSelectedName(){
                const el=document.getElementById('selected-name');
                const s=this.getSelected();
                el.textContent=s?ITEMS[s.id].name+' ×'+s.count:'';
            }
            selectSlot(i){ this.selectedSlot=i; this.renderHotbar(); }
            // 点击背包/快捷栏格子
            slotClick(i){
                const slot=this.inventory[i];
                if(this.cursor===null){
                    if(slot){ this.cursor=slot; this.inventory[i]=null; }
                } else {
                    if(slot===null){ this.inventory[i]=this.cursor; this.cursor=null; }
                    else if(slot.id===this.cursor.id){
                        const space=this.getStackMax(slot.id)-slot.count;
                        const take=Math.min(space,this.cursor.count);
                        slot.count+=take; this.cursor.count-=take;
                        if(this.cursor.count<=0) this.cursor=null;
                    } else { // 交换
                        const tmp=slot; this.inventory[i]=this.cursor; this.cursor=tmp;
                    }
                }
                this.renderHotbar(); this.renderInventory(); this.renderCursor();
            }
            // 点击合成格
            craftSlotClick(i){
                const slot=this.craftSlots[i];
                if(this.cursor===null){
                    if(slot){ this.cursor=slot; this.craftSlots[i]=null; }
                } else {
                    if(slot===null){ this.craftSlots[i]=this.cursor; this.cursor=null; }
                    else if(slot.id===this.cursor.id){
                        const space=this.getStackMax(slot.id)-slot.count;
                        const take=Math.min(space,this.cursor.count);
                        slot.count+=take; this.cursor.count-=take;
                        if(this.cursor.count<=0) this.cursor=null;
                    } else { const tmp=slot; this.craftSlots[i]=this.cursor; this.cursor=tmp; }
                }
                this.renderCraft(); this.renderCursor(); this.renderInventory(); this.renderHotbar();
            }
            // 点击合成结果：合成一次
            craftOnce(){
                const rec=this.getRecipe(); if(!rec) return;
                // 结果先尝试放入背包（合并或空位），否则放光标（光标为空或同物品）
                let placed=false;
                for(let i=0;i<36;i++){ const s=this.inventory[i]; if(s&&s.id===rec.out&&s.count+rec.count<=this.getStackMax(rec.out)){ s.count+=rec.count; placed=true; break; } }
                if(!placed){ for(let i=0;i<36;i++){ if(this.inventory[i]===null){ this.inventory[i]={id:rec.out,count:rec.count}; placed=true; break; } } }
                if(!placed && !this.cursor){ this.cursor={id:rec.out,count:rec.count}; placed=true; }
                if(!placed && this.cursor && this.cursor.id===rec.out && this.cursor.count+rec.count<=this.getStackMax(rec.out)){ this.cursor.count+=rec.count; placed=true; }
                if(!placed) return; // 无空间
                // 消耗材料
                const n=this.craftSize*this.craftSize;
                for(let i=0;i<n;i++){ const s=this.craftSlots[i]; if(s){ s.count--; if(s.count<=0) this.craftSlots[i]=null; } }
                this.playSound('craft');
                this.renderCraft(); this.renderInventory(); this.renderHotbar(); this.renderCursor();
            }
            initPanels(){
                const panel=document.getElementById('inventory-panel');
                const close=document.getElementById('inv-close');
                const result=document.getElementById('craft-result');
                close.addEventListener('click',()=>this.closeInventory());
                close.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.closeInventory(); },{passive:false});
                result.addEventListener('click',(e)=>{ e.stopPropagation(); this.craftOnce(); });
                result.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.craftOnce(); },{passive:false});
            }
            openInventory(mode){
                this.craftMode=mode;
                this.craftSize = mode==='craft3' ? 3 : 2;
                this.craftSlots = new Array(this.craftSize*this.craftSize).fill(null);
                document.getElementById('inv-title').textContent = mode==='craft3' ? '工作台' : '背包';
                document.getElementById('inventory-panel').classList.add('active');
                this.renderCraft(); this.renderInventory();
                // 关闭指针锁定以便操作面板
                if(document.exitPointerLock) document.exitPointerLock();
            }
            closeInventory(){
                // 合成格物品退回背包
                for(let i=0;i<this.craftSlots.length;i++){
                    const s=this.craftSlots[i]; if(s){ this.addItem(s.id, s.count); this.craftSlots[i]=null; }
                }
                if(this.cursor){ this.addItem(this.cursor.id, this.cursor.count); this.cursor=null; }
                document.getElementById('inventory-panel').classList.remove('active');
                this.renderCraft(); this.renderInventory(); this.renderHotbar(); this.renderCursor();
            }

            initResizeHandler(){
                window.addEventListener('resize',()=>{ this.camera.aspect=window.innerWidth/window.innerHeight; this.camera.updateProjectionMatrix(); this.renderer.setSize(window.innerWidth,window.innerHeight); });
                window.addEventListener('orientationchange',()=>{ setTimeout(()=>{ this.camera.aspect=window.innerWidth/window.innerHeight; this.camera.updateProjectionMatrix(); this.renderer.setSize(window.innerWidth,window.innerHeight); },300); });
            }
            initFullscreenButton(){
                const btn=document.getElementById('fullscreen-btn');
                const toggle=()=>{ if(!document.fullscreenElement&&!document.webkitFullscreenElement){ const el=document.documentElement; if(el.requestFullscreen)el.requestFullscreen().catch(()=>{}); else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen(); btn.textContent='✕'; } else { if(document.exitFullscreen)document.exitFullscreen().catch(()=>{}); else if(document.webkitExitFullscreen)document.webkitExitFullscreen(); btn.textContent='⛶'; } };
                btn.addEventListener('click',toggle); btn.addEventListener('touchstart',(e)=>{e.preventDefault();e.stopPropagation();toggle();},{passive:false});
                document.addEventListener('fullscreenchange',()=>{btn.textContent=document.fullscreenElement?'✕':'⛶';});
                document.addEventListener('webkitfullscreenchange',()=>{btn.textContent=document.webkitFullscreenElement?'✕':'⛶';});
            }

            // ---- 触屏 ----
            initTouchControls(){
                const jz=document.getElementById('joystick-zone'), jb=document.getElementById('joystick-base'), jk=document.getElementById('joystick-knob');
                const jumpBtn=document.getElementById('jump-btn'), placeBtn=document.getElementById('place-btn'), breakBtn=document.getElementById('break-btn');
                const flyBtn=document.getElementById('fly-btn'), flyDownBtn=document.getElementById('fly-down-btn'), invBtn=document.getElementById('inventory-btn');
                const canvas=this.renderer.domElement;
                jz.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); if(this.touchState.joystick) return; const t=e.changedTouches[0]; this.touchState.joystick={id:t.identifier,startX:t.clientX,startY:t.clientY}; jb.style.display='block'; jb.style.left=(t.clientX-55)+'px'; jb.style.top=(t.clientY-55)+'px'; jk.style.left='33px'; jk.style.top='33px'; },{passive:false});
                jz.addEventListener('touchmove',(e)=>{ e.preventDefault(); e.stopPropagation(); if(!this.touchState.joystick) return; const t=Array.from(e.touches).find(t=>t.identifier===this.touchState.joystick.id); if(!t) return; const dx=t.clientX-this.touchState.joystick.startX, dy=t.clientY-this.touchState.joystick.startY; const maxDist=45, dist=Math.sqrt(dx*dx+dy*dy), clamped=Math.min(dist,maxDist), ang=Math.atan2(dy,dx); jk.style.left=(33+Math.cos(ang)*clamped)+'px'; jk.style.top=(33+Math.sin(ang)*clamped)+'px'; this.moveInput.x=dx/maxDist; this.moveInput.y=-dy/maxDist; const mag=Math.sqrt(this.moveInput.x**2+this.moveInput.y**2); if(mag>1){this.moveInput.x/=mag;this.moveInput.y/=mag;} },{passive:false});
                const endJz=(e)=>{ const t=Array.from(e.changedTouches).find(t=>this.touchState.joystick&&t.identifier===this.touchState.joystick.id); if(t){ this.touchState.joystick=null; this.moveInput.x=0;this.moveInput.y=0; jb.style.display='none'; } };
                jz.addEventListener('touchend',endJz,{passive:true}); jz.addEventListener('touchcancel',endJz,{passive:true});
                canvas.addEventListener('touchstart',(e)=>{ e.preventDefault(); for(const t of e.changedTouches){ if(!this.touchState.lookTouch) this.touchState.lookTouch={id:t.identifier,lastX:t.clientX,lastY:t.clientY}; } },{passive:false});
                canvas.addEventListener('touchmove',(e)=>{ e.preventDefault(); const t=Array.from(e.changedTouches).find(t=>this.touchState.lookTouch&&t.identifier===this.touchState.lookTouch.id)||Array.from(e.touches).find(t=>this.touchState.lookTouch&&t.identifier===this.touchState.lookTouch.id); if(t){ const dx=t.clientX-this.touchState.lookTouch.lastX, dy=t.clientY-this.touchState.lookTouch.lastY; this.touchState.lookTouch.lastX=t.clientX; this.touchState.lookTouch.lastY=t.clientY; this.lookDelta.x+=dx*TOUCH_SENSITIVITY; this.lookDelta.y+=dy*TOUCH_SENSITIVITY; } },{passive:false});
                const endLook=(e)=>{ const t=Array.from(e.changedTouches).find(t=>this.touchState.lookTouch&&t.identifier===this.touchState.lookTouch.id); if(t) this.touchState.lookTouch=null; };
                canvas.addEventListener('touchend',endLook,{passive:true}); canvas.addEventListener('touchcancel',endLook,{passive:true});
                jumpBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); if(this.isFlying||this.inWater) this.flyUp=true; else this.tryJump(); },{passive:false});
                jumpBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); e.stopPropagation(); this.flyUp=false; },{passive:false});
                breakBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.inputBreak=true; },{passive:false});
                breakBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); e.stopPropagation(); this.inputBreak=false; this.mineProgress=0; this.mineTarget=null; },{passive:false});
                placeBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.useOnce(); },{passive:false});
                invBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.openInventory('craft2'); },{passive:false});
                flyBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.toggleFly(); },{passive:false});
                flyDownBtn.addEventListener('touchstart',(e)=>{ e.preventDefault(); e.stopPropagation(); this.flyDown=true; },{passive:false});
                flyDownBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); e.stopPropagation(); this.flyDown=false; },{passive:false});
                flyDownBtn.addEventListener('touchcancel',()=>{ this.flyDown=false; },{passive:false});
                // 桌面端按钮点击
                invBtn.addEventListener('click',(e)=>{ e.stopPropagation(); this.openInventory('craft2'); });
                flyBtn.addEventListener('click',(e)=>{ e.stopPropagation(); this.toggleFly(); });
                flyDownBtn.addEventListener('mousedown',(e)=>{ e.stopPropagation(); this.flyDown=true; });
                flyDownBtn.addEventListener('mouseup',()=>{ this.flyDown=false; });
                flyDownBtn.addEventListener('mouseleave',()=>{ this.flyDown=false; });
                canvas.addEventListener('contextmenu',(e)=>e.preventDefault());
            }

            // ---- 键鼠 ----
            initKeyboardMouse(){
                const canvas=this.renderer.domElement;
                document.addEventListener('keydown',(e)=>{
                    if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
                    const c=e.code;
                    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)) e.preventDefault();
                    if(e.repeat) return;
                    this.keys[c]=true;
                    if(c==='Space'){ if(this.isFlying||this.inWater) this.flyUp=true; else this.tryJump(); }
                    else if(c==='ShiftLeft'||c==='ShiftRight'){ this.flyDown=true; }
                    else if(c==='KeyE'){ const p=document.getElementById('inventory-panel'); if(p.classList.contains('active')) this.closeInventory(); else this.openInventory('craft2'); }
                    else if(c==='KeyF'){ this.toggleFly(); }
                    else if(c==='F3'){ this.toggleDebug(); }
                    else if(c==='KeyQ'){ this.dropSelected(); }
                    else if(c==='Escape'){ if(document.getElementById('inventory-panel').classList.contains('active')) this.closeInventory(); }
                    else if(c.startsWith('Digit')){ const n=parseInt(c.slice(5)); if(n>=1&&n<=9) this.selectSlot(n-1); }
                });
                document.addEventListener('keyup',(e)=>{ const c=e.code; this.keys[c]=false; if(c==='Space') this.flyUp=false; if(c==='ShiftLeft'||c==='ShiftRight') this.flyDown=false; });
                if(IS_TOUCH) return;
                canvas.addEventListener('mousedown',(e)=>{
                    if(document.pointerLockElement!==canvas){
                        if(canvas.requestPointerLock) canvas.requestPointerLock(); else if(canvas.webkitRequestPointerLock) canvas.webkitRequestPointerLock();
                        return;
                    }
                    e.preventDefault();
                    if(e.button===0) this.inputBreak=true;
                    else if(e.button===2) this.useOnce();
                });
                document.addEventListener('mouseup',(e)=>{ if(e.button===0){ this.inputBreak=false; this.mineProgress=0; this.mineTarget=null; } });
                document.addEventListener('mousemove',(e)=>{ if(document.pointerLockElement===canvas){ this.lookDelta.x+=e.movementX*MOUSE_SENSITIVITY; this.lookDelta.y+=e.movementY*MOUSE_SENSITIVITY; } const badge=document.getElementById('cursor-badge'); if(badge && badge.style.display!=='none'){ badge.style.left=(e.clientX+12)+'px'; badge.style.top=(e.clientY+12)+'px'; } });
                canvas.addEventListener('wheel',(e)=>{ e.preventDefault(); const dir=e.deltaY>0?1:-1; this.selectSlot((this.selectedSlot+dir+9)%9); },{passive:false});
            }
            toggleDebug(){ this.debugVisible=!this.debugVisible; const f=document.getElementById('fps-counter'), d=document.getElementById('debug-info'); if(f)f.style.display=this.debugVisible?'block':'none'; if(d)d.style.display=this.debugVisible?'block':'none'; }

            // ---- 掉落 ----
            spawnDrop(id, count, x, y, z){
                const drop=new ItemDrop(id,count,x,y,z,this);
                this.drops.push(drop);
            }
            dropSelected(){
                const s=this.getSelected(); if(!s) return;
                const dropCount=1;
                const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(this.playerPitch,this.playerYaw,0,'YXZ'));
                const eye=new THREE.Vector3(this.playerPosition.x,this.playerPosition.y+PLAYER_EYE_HEIGHT,this.playerPosition.z);
                this.spawnDrop(s.id, dropCount, eye.x, eye.y, eye.z);
                s.count-=dropCount;
                if(s.count<=0) this.inventory[this.selectedSlot]=null;
                this.renderHotbar(); this.renderInventory();
            }

            // ---- 生命/饥饿/空气 ----
            updateStats(){
                const hb=document.getElementById('health-bar');
                const full=Math.floor(this.health/2), half=this.health%2===1;
                hb.textContent='❤️'.repeat(full)+(half?'💔':'')+'🖤'.repeat(10-full-(half?1:0));
                const gb=document.getElementById('hunger-bar');
                const gf=Math.floor(this.hunger/2), gh=this.hunger%2===1;
                gb.textContent='🍗'.repeat(gf)+(gh?'🍖':'')+'🦴'.repeat(10-gf-(gh?1:0));
                const ab=document.getElementById('air-bar');
                if(this.inWater&&this.air<MAX_AIR){ ab.style.display='block'; ab.textContent='🫧'.repeat(Math.max(0,Math.ceil(this.air))); }
                else ab.style.display='none';
            }
            damage(amount){
                if(this.isDead) return;
                this.health=Math.max(0,this.health-amount);
                this.lastDamageTime=performance.now();
                this.updateStats(); this.flashDamage(); this.playSound('hurt');
                if(this.health<=0) this.die();
            }
            die(){
                if(this.isDead) return; this.isDead=true;
                document.getElementById('death-overlay').style.display='flex';
                setTimeout(()=>this.respawn(),2000);
            }
            respawn(){
                this.isDead=false; this.health=MAX_HEALTH; this.hunger=MAX_HUNGER; this.air=MAX_AIR;
                this.updateStats();
                document.getElementById('death-overlay').style.display='none';
                const g=this.world.getSurface(Math.floor(this.spawnPoint.x),Math.floor(this.spawnPoint.z));
                this.playerPosition.set(this.spawnPoint.x, g.y+0.1, this.spawnPoint.z);
                this.playerVelocity.set(0,0,0); this.fallStartY=null;
            }
            flashDamage(){
                const el=document.getElementById('damage-flash'); if(!el) return;
                el.style.transition='none'; el.style.opacity=0.9;
                requestAnimationFrame(()=>{ el.style.transition='opacity 0.6s ease'; el.style.opacity=0; });
            }
            toggleFly(){
                this.isFlying=!this.isFlying;
                document.getElementById('fly-btn').textContent=this.isFlying?'🦅 落地':'🕊️ 飞行';
                document.getElementById('fly-down-btn').style.display=this.isFlying?'flex':'none';
                if(!this.isFlying){ this.flyUp=false; this.flyDown=false; this.playerVelocity.y=0; }
                this.playSound('place');
            }
            tryJump(){ if(this.isOnGround){ this.playerVelocity.y=JUMP_SPEED; this.isOnGround=false; this.playSound('jump'); this.hunger-=0.05; } }
            isInWater(){
                const fx=Math.floor(this.playerPosition.x), fy=Math.floor(this.playerPosition.y+0.5), fz=Math.floor(this.playerPosition.z);
                return this.world.getBlock(fx,fy,fz)===B.WATER || this.world.getBlock(fx,fy+1,fz)===B.WATER;
            }
            isHeadInWater(){
                return this.world.getBlock(Math.floor(this.playerPosition.x), Math.floor(this.playerPosition.y+PLAYER_EYE_HEIGHT*0.9), Math.floor(this.playerPosition.z))===B.WATER;
            }

            // ---- 目标获取 ----
            getTargetBlock(){
                const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(this.playerPitch,this.playerYaw,0,'YXZ'));
                const eye=new THREE.Vector3(this.playerPosition.x,this.playerPosition.y+PLAYER_EYE_HEIGHT,this.playerPosition.z);
                return raycastVoxel(this.world,eye,dir,MAX_PLACE_DISTANCE);
            }
            getTargetMob(){
                const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(this.playerPitch,this.playerYaw,0,'YXZ'));
                const eye=new THREE.Vector3(this.playerPosition.x,this.playerPosition.y+PLAYER_EYE_HEIGHT,this.playerPosition.z);
                let best=null, bestT=4.5;
                for(const mob of this.animals){
                    if(mob.health<=0) continue;
                    const min=[mob.position.x-0.4, mob.position.y, mob.position.z-0.4];
                    const max=[mob.position.x+0.4, mob.position.y+1.2, mob.position.z+0.4];
                    const t=rayAABB(eye,dir,min,max);
                    if(t>=0&&t<bestT){ bestT=t; best=mob; }
                }
                return best;
            }

            // ---- 使用（右键/放置键） ----
            useOnce(){
                const panel=document.getElementById('inventory-panel');
                if(panel.classList.contains('active')) return;
                const target=this.getTargetBlock();
                // 打开工作台
                if(target && target.blockId===B.CRAFTING_TABLE && target.distance<=MAX_PLACE_DISTANCE){
                    this.openInventory('craft3'); return;
                }
                const sel=this.getSelected();
                if(!sel) return;
                const def=ITEMS[sel.id];
                if(def.type==='block'){
                    if(!target) return;
                    const pp={x:target.x+target.face[0], y:target.y+target.face[1], z:target.z+target.face[2]};
                    if(pp.y<0||pp.y>=CHUNK_HEIGHT) return;
                    const existing=this.world.getBlock(pp.x,pp.y,pp.z);
                    if(existing!==B.AIR&&existing!==B.WATER) return;
                    const pBox=this.getPlayerAABB(); const bBox={minX:pp.x,maxX:pp.x+1,minY:pp.y,maxY:pp.y+1,minZ:pp.z,maxZ:pp.z+1};
                    if(this.aabbIntersect(pBox,bBox)) return;
                    this.world.setBlock(pp.x,pp.y,pp.z,def.blockId);
                    this.playSound('place');
                    this.removeSelected(1);
                    if(this.isOnline) this.sendBlockUpdate(pp.x,pp.y,pp.z,def.blockId);
                } else if(def.type==='food'){
                    if(this.hunger>=MAX_HUNGER) return;
                    this.hunger=Math.min(MAX_HUNGER, this.hunger+def.hunger);
                    this.removeSelected(1);
                    this.playSound('eat');
                    this.updateStats();
                }
            }
            attackMob(){
                if(this.attackCooldown>0) return;
                const mob=this.getTargetMob(); if(!mob) return;
                this.attackCooldown=0.4;
                const sel=this.getSelected();
                const dmg=itemDamage(sel);
                mob.hurt(dmg, this.playerPosition.x, this.playerPosition.z);
                this.playSound('hit');
                // 工具耐久
                if(sel && ITEMS[sel.id].type==='tool'){ sel.dur=(sel.dur!=null?sel.dur:ITEMS[sel.id].durability)-1; if(sel.dur<=0){ this.inventory[this.selectedSlot]=null; this.playSound('break'); } this.renderHotbar(); this.renderInventory(); }
            }

            // ---- 挖掘 ----
            getBreakSpeed(target){
                const prop=BLOCK_PROPS[target.blockId];
                if(!prop||prop.hardness<0) return 0;
                const sel=this.getSelected();
                let speed=1;
                let toolMatch=true;
                if(prop.reqTool){
                    if(!sel || ITEMS[sel.id].type!=='tool' || ITEMS[sel.id].tool!==prop.reqTool) toolMatch=false;
                }
                if(sel && ITEMS[sel.id].type==='tool'){
                    if(prop.speedTool && ITEMS[sel.id].tool===prop.speedTool) speed=ITEMS[sel.id].speed;
                    else if(!prop.reqTool) speed=1.5;
                    else speed=1;
                }
                if(!toolMatch) return 0.2/prop.hardness; // 徒手/错误工具：很慢且不掉落
                return speed/prop.hardness;
            }
            mineTick(dt){
                const target=this.getTargetBlock();
                const prog=document.getElementById('mine-progress');
                if(!target || target.blockId===B.BEDROCK){
                    this.mineTarget=null; this.mineProgress=0; prog.style.display='none';
                    this.mineOverlay.visible=false; return;
                }
                if(!this.mineTarget || this.mineTarget.x!==target.x||this.mineTarget.y!==target.y||this.mineTarget.z!==target.z){
                    this.mineTarget=target; this.mineProgress=0;
                }
                const speed=this.getBreakSpeed(target);
                if(speed<=0){ prog.style.display='none'; this.mineOverlay.visible=false; return; }
                this.mineProgress+=dt*speed;
                prog.style.display='block'; prog.firstChild.style.width=(this.mineProgress*100).toFixed(0)+'%';
                // 变暗覆盖
                this.mineOverlay.position.set(target.x+0.5,target.y+0.5,target.z+0.5);
                this.mineOverlay.visible=true; this.mineOverlay.material.opacity=Math.min(0.6,this.mineProgress*0.6);
                if(this.mineProgress>=1){
                    // 破坏
                    const prop=BLOCK_PROPS[target.blockId];
                    const blockId=target.blockId;
                    this.world.setBlock(target.x,target.y,target.z,B.AIR);
                    this.playSound('break');
                    // 掉落
                    const drops=prop.drop();
                    for(const d of drops) this.spawnDrop(d.id,d.count,target.x+0.5,target.y+0.5,target.z+0.5);
                    // 工具耐久
                    const sel=this.getSelected();
                    if(sel && ITEMS[sel.id].type==='tool'){ sel.dur=(sel.dur!=null?sel.dur:ITEMS[sel.id].durability)-1; if(sel.dur<=0){ this.inventory[this.selectedSlot]=null; this.playSound('break'); } this.renderHotbar(); this.renderInventory(); }
                    this.mineTarget=null; this.mineProgress=0; prog.style.display='none'; this.mineOverlay.visible=false;
                    if(this.isOnline) this.sendBlockUpdate(target.x,target.y,target.z,B.AIR);
                }
            }

            sendBlockUpdate(x,y,z,id){ Object.values(this.connections).forEach(c=>{ if(c.open) c.send({type:'block',x:x,y:y,z:z,blockId:id}); }); }
            getPlayerAABB(){ const hw=PLAYER_WIDTH/2; return {minX:this.playerPosition.x-hw,maxX:this.playerPosition.x+hw,minY:this.playerPosition.y,maxY:this.playerPosition.y+PLAYER_HEIGHT,minZ:this.playerPosition.z-hw,maxZ:this.playerPosition.z+hw}; }
            aabbIntersect(a,b){ return a.minX<b.maxX&&a.maxX>b.minX&&a.minY<b.maxY&&a.maxY>b.minY&&a.minZ<b.maxZ&&a.maxZ>b.minZ; }
            checkCollision(pos){ const hw=PLAYER_WIDTH/2; const minX=Math.floor(pos.x-hw),maxX=Math.floor(pos.x+hw),minY=Math.floor(pos.y),maxY=Math.floor(pos.y+PLAYER_HEIGHT),minZ=Math.floor(pos.z-hw),maxZ=Math.floor(pos.z+hw); for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++)for(let z=minZ;z<=maxZ;z++) if(this.world.isSolid(x,y,z)) return true; return false; }

            // ---- 玩家更新 ----
            updatePlayer(dt){
                if(document.getElementById('inventory-panel').classList.contains('active')){ this.moveInput.x=0; this.moveInput.y=0; return; }
                if(this.lookDelta.x!==0||this.lookDelta.y!==0){
                    this.playerYaw-=this.lookDelta.x;
                    this.playerPitch-=this.lookDelta.y;
                    this.playerPitch=Math.max(-Math.PI/2+0.01,Math.min(Math.PI/2-0.01,this.playerPitch));
                    this.lookDelta.x=0; this.lookDelta.y=0;
                }
                let ix=this.moveInput.x, iy=this.moveInput.y;
                if(this.keys['KeyW']||this.keys['ArrowUp']) iy+=1;
                if(this.keys['KeyS']||this.keys['ArrowDown']) iy-=1;
                if(this.keys['KeyA']||this.keys['ArrowLeft']) ix-=1;
                if(this.keys['KeyD']||this.keys['ArrowRight']) ix+=1;
                ix=clamp(ix,-1,1); iy=clamp(iy,-1,1);
                const wasInWater=this.inWater;
                this.inWater=this.isInWater();
                if(this.inWater&&!wasInWater) this.playSound('splash');
                const forward=new THREE.Vector3(-Math.sin(this.playerYaw),0,-Math.cos(this.playerYaw));
                const right=new THREE.Vector3(Math.cos(this.playerYaw),0,-Math.sin(this.playerYaw));
                const moveVec=new THREE.Vector3().addScaledVector(forward,iy).addScaledVector(right,ix);
                if(moveVec.length()>1)moveVec.normalize();
                const speed=this.isFlying?FLY_SPEED:(this.inWater?WALK_SPEED*0.7:WALK_SPEED);
                const accel=this.isOnGround?12:(this.inWater?8:(this.isFlying?14:5));
                this.playerVelocity.x+=(moveVec.x*speed-this.playerVelocity.x)*Math.min(1,accel*dt);
                this.playerVelocity.z+=(moveVec.z*speed-this.playerVelocity.z)*Math.min(1,accel*dt);
                if(this.isFlying){
                    let vy=0; if(this.flyUp)vy+=1; if(this.flyDown)vy-=1;
                    this.playerVelocity.y=vy*FLY_SPEED; this.fallStartY=null;
                } else if(this.inWater){
                    this.playerVelocity.y+=GRAVITY*0.15*dt;
                    if(this.playerVelocity.y<-5)this.playerVelocity.y=-5;
                    if(this.flyUp)this.playerVelocity.y=Math.max(this.playerVelocity.y,4.5);
                    else this.playerVelocity.y+=2*dt; // 浮力，趋向浮到水面
                    if(this.playerVelocity.y>3.5)this.playerVelocity.y=3.5;
                    this.fallStartY=null;
                } else {
                    this.playerVelocity.y+=GRAVITY*dt;
                    if(this.playerVelocity.y<-30)this.playerVelocity.y=-30;
                    if(!this.isOnGround&&(this.fallStartY===null||this.playerPosition.y>this.fallStartY)) this.fallStartY=this.playerPosition.y;
                }
                const newX=this.playerPosition.x+this.playerVelocity.x*dt; if(!this.checkCollision(new THREE.Vector3(newX,this.playerPosition.y,this.playerPosition.z))) this.playerPosition.x=newX; else this.playerVelocity.x=0;
                const newZ=this.playerPosition.z+this.playerVelocity.z*dt; if(!this.checkCollision(new THREE.Vector3(this.playerPosition.x,this.playerPosition.y,newZ))) this.playerPosition.z=newZ; else this.playerVelocity.z=0;
                const newY=this.playerPosition.y+this.playerVelocity.y*dt;
                if(!this.checkCollision(new THREE.Vector3(this.playerPosition.x,newY,this.playerPosition.z))){
                    this.playerPosition.y=newY; this.isOnGround=false;
                } else {
                    if(this.playerVelocity.y<0){
                        this.isOnGround=true;
                        if(this.fallStartY!==null&&!this.isFlying){
                            const dist=this.fallStartY-this.playerPosition.y;
                            if(dist>4) this.damage(Math.round((dist-3)*2));
                            this.fallStartY=null;
                        }
                        if(this.playerVelocity.y<-8)this.playSound('land');
                    }
                    this.playerVelocity.y=0;
                }
                if(this.world.isSolid(Math.floor(this.playerPosition.x),Math.floor(this.playerPosition.y-0.01),Math.floor(this.playerPosition.z))) this.isOnGround=true;
                if(this.isOnGround) this.fallStartY=null;

                // 溺水
                if(this.isHeadInWater()){
                    this.air-=dt;
                    if(this.air<=0){ this.air=0; if(!this.isDead && performance.now()-this.lastDamageTime>1000){ this.damage(2); } }
                } else { this.air=Math.min(MAX_AIR, this.air+dt*2); }
                // 虚空
                if(this.playerPosition.y<-24){ this.respawn(); }
                // 生命回复（饥饿充足时）
                if(!this.isDead&&this.health<MAX_HEALTH&&performance.now()-this.lastDamageTime>4000&&this.isOnGround&&this.hunger>=18){
                    this.regenTimer-=dt; if(this.regenTimer<=0){ this.regenTimer=1.5; this.health=Math.min(MAX_HEALTH,this.health+1); this.updateStats(); }
                }
                // 饥饿消耗
                const moving=(moveVec.x!==0||moveVec.y!==0);
                this.hungerDrain+=dt*(moving?0.10:0.02)+(this.flyUp&&this.inWater?0.15:0);
                if(this.hungerDrain>=1){ this.hungerDrain=0; if(this.hunger>0){ this.hunger-=1; this.updateStats(); } }
                // 饥饿掉血
                if(this.hunger<=0){
                    this.starveTimer+=dt;
                    if(this.starveTimer>=4){ this.starveTimer=0; if(this.health>1) this.damage(1); }
                } else this.starveTimer=0;

                if(this.isOnline) this.sendPositionUpdate();
            }
            sendPositionUpdate(){
                if(!this.peer||!this.isOnline) return;
                Object.values(this.connections).forEach(c=>{ if(c.open) c.send({type:'pos',x:this.playerPosition.x,y:this.playerPosition.y,z:this.playerPosition.z,yaw:this.playerYaw,pitch:this.playerPitch}); });
            }
            updateCamera(){ this.camera.position.set(this.playerPosition.x,this.playerPosition.y+PLAYER_EYE_HEIGHT,this.playerPosition.z); this.camera.rotation.order='YXZ'; this.camera.rotation.y=this.playerYaw; this.camera.rotation.x=this.playerPitch; }
            updateHighlight(){
                const target=this.getTargetBlock();
                if(target&&target.blockId!==B.AIR&&target.blockId!==B.WATER){
                    this.highlightMesh.position.set(target.x+0.5,target.y+0.5,target.z+0.5);
                    this.highlightMesh.visible=true; this.raycastResult=target;
                } else { this.highlightMesh.visible=false; this.raycastResult=null; }
                // 目标名称（含生物）
                const mob=this.getTargetMob();
                const tn=document.getElementById('target-name');
                if(mob) tn.textContent=MOB_TYPES[mob.type].name+' ❤'+Math.ceil(mob.health);
                else if(target&&target.blockId!==B.AIR&&target.blockId!==B.WATER) tn.textContent=BLOCK_NAMES[target.blockId];
                else tn.textContent='';
                const uw=document.getElementById('underwater-overlay');
                if(uw) uw.style.opacity=this.inWater?0.85:0;
                this.updateStats();
                if(this.debugVisible){
                    const f=document.getElementById('fps-counter'); if(f) f.textContent='FPS: '+this.fpsDisplay;
                    const d=document.getElementById('debug-info');
                    if(d){ const p=this.playerPosition; d.textContent='XYZ '+p.x.toFixed(1)+' / '+p.y.toFixed(1)+' / '+p.z.toFixed(1)+'\nCHUNK '+Math.floor(p.x/16)+','+Math.floor(p.z/16)+'\nYAW '+((this.playerYaw*180/Math.PI+360)%360).toFixed(0)+'°\nFPS '+this.fpsDisplay+'  生物 '+this.animals.length+'\n区块 '+this.world.chunks.size+'  时间 '+(Math.floor(this.dayTime*24))+'时\n飞行 '+(this.isFlying?'是':'否')+'  水中 '+(this.inWater?'是':'否')+'\n生命 '+this.health+'  饥饿 '+Math.round(this.hunger)+'  空气 '+Math.round(this.air); }
                }
            }

            // ---- 粒子 ----
            spawnBlockParticles(x,y,z,blockId){
                const colors={[B.GRASS]:0x6B8E23,[B.DIRT]:0x8B6B3D,[B.STONE]:0x808080,[B.COBBLESTONE]:0x888888,[B.LOG]:0x8B5A2B,[B.LEAVES]:0x2E8B57,[B.SAND]:0xE8D8A0,[B.BRICK]:0x8B3A3A,[B.PLANK]:0xCD9B5A,[B.COAL_ORE]:0x2B2B2B,[B.IRON_ORE]:0xC0C0C0,[B.GOLD_ORE]:0xFFD700,[B.DIAMOND_ORE]:0x00C8C8,[B.REDSTONE_ORE]:0xB40000,[B.LAPIS_ORE]:0x1E3296,[B.SNOW_BLOCK]:0xF0F8FF,[B.PUMPKIN]:0xFF8C00,[B.MELON]:0x7CFC00,[B.BOOKSHELF]:0x8B6B3D};
                const color=colors[blockId]||0xcccccc; const positions=[];
                for(let i=0;i<12;i++) positions.push(x+(Math.random()-0.5)*0.6,y+(Math.random()-0.5)*0.6,z+(Math.random()-0.5)*0.6);
                const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
                const mat=new THREE.PointsMaterial({color:color,size:0.06,transparent:true,opacity:0.9,sizeAttenuation:true});
                const pts=new THREE.Points(geo,mat); pts.userData={lifetime:0.4,age:0,velocities:positions.map(()=>({vx:(Math.random()-0.5)*2,vy:Math.random()*3,vz:(Math.random()-0.5)*2}))};
                this.scene.add(pts); this.particles.push(pts);
            }
            updateParticles(dt){
                for(let i=this.particles.length-1;i>=0;i--){ const p=this.particles[i]; p.userData.age+=dt; if(p.userData.age>=p.userData.lifetime){ this.scene.remove(p); p.geometry.dispose(); p.material.dispose(); this.particles.splice(i,1); continue; } const pos=p.geometry.attributes.position; const vels=p.userData.velocities; for(let j=0;j<pos.count;j++){ pos.array[j*3]+=vels[j].vx*dt; pos.array[j*3+1]+=vels[j].vy*dt; pos.array[j*3+2]+=vels[j].vz*dt; vels[j].vy-=9*dt; } pos.needsUpdate=true; p.material.opacity=0.9*(1-p.userData.age/p.userData.lifetime); }
            }

            // ---- 音频 ----
            initAudio(){ this.audioCtx=null; }
            playSound(type){
                try{
                    if(!this.audioCtx) this.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
                    if(this.audioCtx.state==='suspended') this.audioCtx.resume();
                    const ctx=this.audioCtx, osc=ctx.createOscillator(), gain=ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination); const now=ctx.currentTime;
                    if(type==='place'){ osc.type='square'; osc.frequency.setValueAtTime(300,now); osc.frequency.exponentialRampToValueAtTime(100,now+0.08); gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.1); osc.start(now); osc.stop(now+0.1); }
                    else if(type==='break'){ osc.type='square'; osc.frequency.setValueAtTime(200,now); osc.frequency.exponentialRampToValueAtTime(80,now+0.1); gain.gain.setValueAtTime(0.18,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.12); osc.start(now); osc.stop(now+0.12); }
                    else if(type==='jump'){ osc.type='sine'; osc.frequency.setValueAtTime(200,now); osc.frequency.exponentialRampToValueAtTime(400,now+0.06); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.08); osc.start(now); osc.stop(now+0.08); }
                    else if(type==='land'){ osc.type='sine'; osc.frequency.setValueAtTime(150,now); osc.frequency.exponentialRampToValueAtTime(80,now+0.06); gain.gain.setValueAtTime(0.08,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.07); osc.start(now); osc.stop(now+0.07); }
                    else if(type==='hurt'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(300,now); osc.frequency.exponentialRampToValueAtTime(60,now+0.2); gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.22); osc.start(now); osc.stop(now+0.22); }
                    else if(type==='splash'){ osc.type='triangle'; osc.frequency.setValueAtTime(500,now); osc.frequency.exponentialRampToValueAtTime(120,now+0.15); gain.gain.setValueAtTime(0.12,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.16); osc.start(now); osc.stop(now+0.16); }
                    else if(type==='pickup'){ osc.type='sine'; osc.frequency.setValueAtTime(500,now); osc.frequency.exponentialRampToValueAtTime(900,now+0.08); gain.gain.setValueAtTime(0.08,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.09); osc.start(now); osc.stop(now+0.09); }
                    else if(type==='eat'){ osc.type='square'; osc.frequency.setValueAtTime(180,now); osc.frequency.setValueAtTime(240,now+0.06); osc.frequency.setValueAtTime(160,now+0.12); gain.gain.setValueAtTime(0.12,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.2); osc.start(now); osc.stop(now+0.2); }
                    else if(type==='hit'){ osc.type='square'; osc.frequency.setValueAtTime(150,now); osc.frequency.exponentialRampToValueAtTime(60,now+0.08); gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.09); osc.start(now); osc.stop(now+0.09); }
                    else if(type==='craft'){ osc.type='square'; osc.frequency.setValueAtTime(400,now); osc.frequency.setValueAtTime(600,now+0.05); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.12); osc.start(now); osc.stop(now+0.12); }
                }catch(e){}
            }

            // ---- 生物 ----
            spawnAnimals(n){
                n=n||10;
                const types=['pig','cow','sheep','chicken'];
                let spawned=0, attempts=0;
                while(spawned<n && attempts<40){
                    attempts++;
                    const type=types[Math.floor(Math.random()*types.length)];
                    const angle=Math.random()*Math.PI*2, dist=6+Math.random()*14;
                    const wx=this.playerPosition.x+Math.cos(angle)*dist, wz=this.playerPosition.z+Math.sin(angle)*dist;
                    const s=this.world.getSurface(Math.floor(wx),Math.floor(wz));
                    // 只生成在陆地（草地/泥土，水面以上，且头顶是空气）
                    if(s.y<=SEA_LEVEL) continue;
                    if(this.world.getBlock(Math.floor(wx),s.y,Math.floor(wz))!==B.AIR) continue;
                    const b=this.world.getBlock(Math.floor(wx),s.y-1,Math.floor(wz));
                    if(b!==B.GRASS&&b!==B.DIRT&&b!==B.SAND) continue;
                    const animal=new Animal(type, wx, s.y+0.01, wz, this.world, this);
                    this.scene.add(animal.group); this.animals.push(animal); spawned++;
                }
            }
            updateAnimals(dt){
                this.animalTimer-=dt;
                if(this.animalTimer<=0){
                    this.animalTimer=8;
                    // 清除死亡/过远生物
                    for(let i=this.animals.length-1;i>=0;i--){
                        const a=this.animals[i];
                        if(a.health<=0 || a.position.distanceTo(this.playerPosition)>70){
                            this.scene.remove(a.group); this.animals.splice(i,1);
                        }
                    }
                    if(this.animals.length<10) this.spawnAnimals(2);
                }
            }

            // ---- 存档 ----
            encodeBlocks(arr){ let bin=''; for(let i=0;i<arr.length;i++) bin+=String.fromCharCode(arr[i]); return btoa(bin); }
            decodeBlocks(b64){ const bin=atob(b64), out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
            serializeItem(s){ if(!s) return null; return {i:s.id, c:s.count, d:s.dur}; }
            deserializeItem(s){ if(!s) return null; const it={id:s.i, count:s.c}; if(s.d!=null) it.dur=s.d; return it; }
            saveGame(){
                if(this.isOnline) return;
                try{
                    const chunks={};
                    const pcx=Math.floor(this.playerPosition.x/CHUNK_SIZE), pcz=Math.floor(this.playerPosition.z/CHUNK_SIZE);
                    for(const [key,chunk] of this.world.chunks){
                        const dist=Math.max(Math.abs(chunk.cx-pcx),Math.abs(chunk.cz-pcz));
                        if(dist<=RENDER_DISTANCE+1) chunks[key]=this.encodeBlocks(chunk.blocks);
                    }
                    const data={v:2, seed:this.worldSeed,
                        player:{x:this.playerPosition.x,y:this.playerPosition.y,z:this.playerPosition.z,yaw:this.playerYaw,pitch:this.playerPitch},
                        health:this.health, hunger:this.hunger, air:this.air, dayTime:this.dayTime, selectedSlot:this.selectedSlot,
                        inventory:this.inventory.map(this.serializeItem), cursor:this.serializeItem(this.cursor), chunks:chunks};
                    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
                }catch(e){ console.warn('存档失败',e); }
            }
            loadGame(data){
                try{
                    for(const key in data.chunks){
                        const parts=key.split(','); const cx=parseInt(parts[0],10), cz=parseInt(parts[1],10);
                        const chunk={cx:cx,cz:cz,blocks:this.decodeBlocks(data.chunks[key]),heightMap:null,mesh:null,waterMesh:null,dirty:true};
                        this.world.chunks.set(key,chunk);
                    }
                    if(data.player){ this.playerPosition.set(data.player.x,data.player.y,data.player.z); this.playerYaw=data.player.yaw||0; this.playerPitch=data.player.pitch||0; }
                    if(data.health!=null) this.health=data.health;
                    if(data.hunger!=null) this.hunger=data.hunger;
                    if(data.air!=null) this.air=data.air;
                    if(data.dayTime!=null) this.dayTime=data.dayTime;
                    if(data.selectedSlot!=null) this.selectedSlot=data.selectedSlot;
                    if(data.inventory){ for(let i=0;i<36;i++) this.inventory[i]=this.deserializeItem(data.inventory[i]); }
                    if(data.cursor) this.cursor=this.deserializeItem(data.cursor);
                }catch(e){ console.warn('读取存档失败',e); }
            }

            gameLoop(){
                requestAnimationFrame(()=>this.gameLoop());
                const now=performance.now(); const dt=Math.min(0.05,(now-this.lastTime)/1000); this.lastTime=now;
                this.fpsCounter++; this.fpsTime+=dt;
                if(this.fpsTime>=0.5){ this.fpsDisplay=Math.round(this.fpsCounter/this.fpsTime); this.fpsCounter=0; this.fpsTime=0; }
                if(this.attackCooldown>0) this.attackCooldown-=dt;
                this.updateSky(dt);
                this.updatePlayer(dt);
                // 挖掘或攻击
                if(this.inputBreak && !document.getElementById('inventory-panel').classList.contains('active')){
                    const mob=this.getTargetMob();
                    if(mob) this.attackMob();
                    else this.mineTick(dt);
                } else { this.mineTarget=null; this.mineProgress=0; this.mineOverlay.visible=false; document.getElementById('mine-progress').style.display='none'; }
                this.updateCamera(); this.updateHighlight(); this.updateChunks(); this.updateParticles(dt);
                for(const a of this.animals) a.update(dt);
                this.updateAnimals(dt);
                for(let i=this.drops.length-1;i>=0;i--){ if(!this.drops[i].update(dt)){ this.drops[i].dispose(); this.drops.splice(i,1); } }
                if(this.cloudGroup){ this.cloudGroup.position.x+=dt*0.3; if(this.cloudGroup.position.x>60)this.cloudGroup.position.x=-60; }
                this.saveTimer+=dt;
                if(this.saveTimer>10 && !this.isOnline){ this.saveTimer=0; this.saveGame(); }
                this.renderer.render(this.scene,this.camera);
            }

            // ---- 联机 ----
            initMultiplayer(){
                this.updateOnlineStatus('🌐 联机中...');
                const peerId='mc-room-'+this.roomCode;
                if(typeof Peer==='undefined'){
                    this.updateOnlineStatus('🔴 联机库加载中...');
                    const script=document.createElement('script');
                    script.src='https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js';
                    script.onload=()=>this.startPeer(peerId);
                    script.onerror=()=>this.updateOnlineStatus('🔴 联机库加载失败，请检查网络');
                    document.head.appendChild(script);
                } else this.startPeer(peerId);
            }
            startPeer(peerId){
                try{
                    this.peer=new Peer(peerId);
                    this.peer.on('open',()=>{ this.updateOnlineStatus('🌐 已创建房间 '+this.roomCode); });
                    this.peer.on('connection',(c)=>this.setupConnection(c));
                    this.peer.on('disconnected',()=>this.updateOnlineStatus('🔴 连接断开'));
                    this.peer.on('error',(err)=>{
                        if(err.type==='unavailable-id'){
                            this.updateOnlineStatus('🌐 正在加入房间...');
                            this.peer=new Peer();
                            this.peer.on('open',()=>{ const c=this.peer.connect(peerId,{reliable:true}); this.setupConnection(c); });
                            this.peer.on('error',(err2)=>{ this.updateOnlineStatus('🔴 联机失败: '+err2.type); });
                        } else this.updateOnlineStatus('🔴 联机错误: '+err.type);
                    });
                }catch(e){ this.updateOnlineStatus('🔴 联机初始化错误'); }
            }
            setupConnection(conn){
                conn.on('open',()=>{
                    this.connections[conn.peer]=conn; this.connectionCount++;
                    this.updateOnlineStatus('🌐 已连接 ('+this.connectionCount+'人)');
                    conn.send({type:'pos',x:this.playerPosition.x,y:this.playerPosition.y,z:this.playerPosition.z,yaw:this.playerYaw,pitch:this.playerPitch});
                });
                conn.on('data',(data)=>{
                    if(data.type==='pos'){
                        if(!this.remotePlayers[conn.peer]) this.createRemotePlayer(conn.peer);
                        const p=this.remotePlayers[conn.peer]; p.group.position.set(data.x,data.y,data.z); p.group.rotation.y=data.yaw||0;
                    } else if(data.type==='block') this.world.setBlock(data.x,data.y,data.z,data.blockId);
                });
                conn.on('close',()=>{
                    delete this.connections[conn.peer];
                    if(this.remotePlayers[conn.peer]){ this.scene.remove(this.remotePlayers[conn.peer].group); delete this.remotePlayers[conn.peer]; }
                    this.connectionCount=Math.max(0,this.connectionCount-1);
                    this.updateOnlineStatus('🌐 已连接 ('+this.connectionCount+'人)');
                });
            }
            createRemotePlayer(pid){
                const g=new THREE.Group();
                const body=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.6,0.4),new THREE.MeshLambertMaterial({color:0x3366cc})); body.position.y=0.8;
                const head=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),new THREE.MeshLambertMaterial({color:0xffaa88})); head.position.y=1.8;
                g.add(body); g.add(head); this.scene.add(g); this.remotePlayers[pid]={group:g};
            }
            updateOnlineStatus(text){ const el=document.getElementById('online-status'); if(el) el.textContent=text; }
        }

        // ==================== 启动 ====================
        function showError(msg){ const el=document.getElementById('error-message'); if(el){ el.textContent=msg; el.style.display='block'; setTimeout(()=>{el.style.display='none';},4000); } }

        window.addEventListener('DOMContentLoaded',()=>{
            const loadingScreen=document.getElementById('loading-screen');
            const loadingBar=document.getElementById('loading-bar');
            const loadingBarContainer=document.getElementById('loading-bar-container');
            const loadingText=document.getElementById('loading-text');
            const startSingleBtn=document.getElementById('start-single');
            const startOnlineBtn=document.getElementById('start-online');
            const resumeBtn=document.getElementById('resume-single');
            const roomInput=document.getElementById('room-input');
            const seedInput=document.getElementById('seed-input');

            let hasSave=false; try{ hasSave=!!localStorage.getItem(SAVE_KEY); }catch(e){}
            if(hasSave) resumeBtn.style.display='block';

            function startGame(seed, roomCode, isOnline, saveData){
                try{
                    loadingBarContainer.style.display='block';
                    loadingText.textContent=saveData?'正在读取存档...':(isOnline?'正在连接联机...':'正在生成世界...');
                    loadingScreen.querySelector('.menu-panel').style.display='none';
                    let progress=0;
                    const interval=setInterval(()=>{
                        progress+=10; loadingBar.style.width=progress+'%';
                        if(progress>=100){ clearInterval(interval); loadingScreen.classList.add('hidden'); setTimeout(()=>document.getElementById('touch-hint').classList.add('hidden'),5000); }
                    },120);
                    const game=new MinecraftMobile(seed, roomCode, isOnline, saveData);
                    window.game=game;
                }catch(err){
                    console.error('游戏初始化失败:',err);
                    showError('游戏启动失败: '+err.message);
                    loadingBarContainer.style.display='none';
                    loadingScreen.querySelector('.menu-panel').style.display='flex';
                    loadingText.textContent='';
                }
            }

            startSingleBtn.addEventListener('click',()=>{
                let seed=Math.floor(Math.random()*1000000); const sv=seedInput.value.trim(); if(sv) seed=hashString(sv);
                try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
                startGame(seed,null,false,null);
            });
            startSingleBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); startSingleBtn.click(); });
            resumeBtn.addEventListener('click',()=>{
                let save=null; try{ save=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
                if(save&&save.seed!=null) startGame(save.seed,null,false,save);
                else { showError('没有可用的存档'); resumeBtn.style.display='none'; }
            });
            resumeBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); resumeBtn.click(); });
            startOnlineBtn.addEventListener('click',()=>{
                const roomCode=roomInput.value.trim(); if(!roomCode){ alert('请输入房间号'); return; }
                const seed=hashString(roomCode); startGame(seed,roomCode,true,null);
            });
            startOnlineBtn.addEventListener('touchend',(e)=>{ e.preventDefault(); startOnlineBtn.click(); });

            let pressTimer=null;
            document.addEventListener('touchstart',()=>{ pressTimer=setTimeout(()=>{ if(window.game) window.game.toggleDebug(); },2000); },{passive:true});
            document.addEventListener('touchend',()=>{ if(pressTimer) clearTimeout(pressTimer); pressTimer=null; },{passive:true});
        });
    })();
    </script>
</body>
