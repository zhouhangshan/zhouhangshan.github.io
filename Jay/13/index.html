                        this.tryJump();
                    }, { passive: false });
                    jumpBtn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.touchState.jumpPressed = false;
                    }, { passive: false });

                    // 放置按钮
                    placeBtn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.placeBlock();
                    }, { passive: false });

                    // 破坏按钮
                    breakBtn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.breakBlock();
                    }, { passive: false });

                    // 点击画布放置方块（右侧区域）
                    let lastTapTime = 0;
                    canvas.addEventListener('click', (e) => {
                        const now = performance.now();
                        if (now - lastTapTime < 300) return;
                        lastTapTime = now;
                        if (e.clientX < window.innerWidth * 0.45) return;
                        this.placeBlock();
                    });

                    // 阻止上下文菜单
                    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
                }

                findTouch(touches, id) {
                    if (id === undefined || id === null) return null;
                    for (const touch of touches) {
                        if (touch.identifier === id) return touch;
                    }
                    return null;
                }

                tryJump() {
                    if (this.isOnGround) {
                        this.playerVelocity.y = JUMP_SPEED;
                        this.isOnGround = false;
                        this.playSound('jump');
                    }
                }

                placeBlock() {
                    const target = this.getTargetBlock();
                    if (!target) return;
                    const placePos = {
                        x: target.x + target.face[0],
                        y: target.y + target.face[1],
                        z: target.z + target.face[2],
                    };
                    if (placePos.y < 0 || placePos.y >= CHUNK_HEIGHT) return;

                    const existingBlock = this.world.getBlock(placePos.x, placePos.y, placePos.z);
                    if (existingBlock !== BLOCK.AIR && existingBlock !== BLOCK.WATER) return;

                    // 检查是否与玩家重叠
                    const playerBox = this.getPlayerAABB();
                    const blockBox = {
                        minX: placePos.x,
                        maxX: placePos.x + 1,
                        minY: placePos.y,
                        maxY: placePos.y + 1,
                        minZ: placePos.z,
                        maxZ: placePos.z + 1,
                    };
                    if (this.aabbIntersect(playerBox, blockBox)) return;

                    const blockId = PLACEABLE_BLOCKS[this.selectedSlot];
                    this.world.setBlock(placePos.x, placePos.y, placePos.z, blockId);
                    this.playSound('place');
                    this.spawnBlockParticles(placePos.x + 0.5, placePos.y + 0.5, placePos.z + 0.5, blockId);
                }

                breakBlock() {
                    const target = this.getTargetBlock();
                    if (!target) return;
                    if (target.blockId === BLOCK.BEDROCK) return;
                    if (target.blockId === BLOCK.WATER || target.blockId === BLOCK.AIR) return;
                    const blockId = target.blockId;
                    this.world.setBlock(target.x, target.y, target.z, BLOCK.AIR);
                    this.playSound('break');
                    this.spawnBlockParticles(target.x + 0.5, target.y + 0.5, target.z + 0.5, blockId);
                }

                getTargetBlock() {
                    const direction = new THREE.Vector3(0, 0, -1);
                    direction.applyEuler(new THREE.Euler(this.playerPitch, this.playerYaw, 0, 'YXZ'));
                    const eyePos = new THREE.Vector3(
                        this.playerPosition.x,
                        this.playerPosition.y + PLAYER_EYE_HEIGHT,
                        this.playerPosition.z
                    );
                    return raycastVoxel(this.world, eyePos, direction, MAX_PLACE_DISTANCE);
                }

                getPlayerAABB() {
                    const halfW = PLAYER_WIDTH / 2;
                    return {
                        minX: this.playerPosition.x - halfW,
                        maxX: this.playerPosition.x + halfW,
                        minY: this.playerPosition.y,
                        maxY: this.playerPosition.y + PLAYER_HEIGHT,
                        minZ: this.playerPosition.z - halfW,
                        maxZ: this.playerPosition.z + halfW,
                    };
                }

                aabbIntersect(a, b) {
                    return a.minX < b.maxX && a.maxX > b.minX &&
                        a.minY < b.maxY && a.maxY > b.minY &&
                        a.minZ < b.maxZ && a.maxZ > b.minZ;
                }

                checkCollision(pos) {
                    const halfW = PLAYER_WIDTH / 2;
                    const minX = Math.floor(pos.x - halfW);
                    const maxX = Math.floor(pos.x + halfW);
                    const minY = Math.floor(pos.y);
                    const maxY = Math.floor(pos.y + PLAYER_HEIGHT);
                    const minZ = Math.floor(pos.z - halfW);
                    const maxZ = Math.floor(pos.z + halfW);

                    for (let x = minX; x <= maxX; x++) {
                        for (let y = minY; y <= maxY; y++) {
                            for (let z = minZ; z <= maxZ; z++) {
                                if (this.world.isSolid(x, y, z)) {
                                    return true;
                                }
                            }
                        }
                    }
                    return false;
                }

                updatePlayer(deltaTime) {
                    // 视角旋转
                    if (this.lookDelta.x !== 0 || this.lookDelta.y !== 0) {
                        this.playerYaw -= this.lookDelta.x * TOUCH_SENSITIVITY;
                        this.playerPitch -= this.lookDelta.y * TOUCH_SENSITIVITY;
                        this.playerPitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, this.playerPitch));
                        this.lookDelta.x = 0;
                        this.lookDelta.y = 0;
                    }

                    // 移动方向
                    const forward = new THREE.Vector3(-Math.sin(this.playerYaw), 0, -Math.cos(this.playerYaw));
                    const right = new THREE.Vector3(Math.cos(this.playerYaw), 0, -Math.sin(this.playerYaw));
                    const moveVec = new THREE.Vector3();
                    moveVec.addScaledVector(forward, this.moveInput.y);
                    moveVec.addScaledVector(right, this.moveInput.x);
                    if (moveVec.length() > 1) moveVec.normalize();

                    const speed = this.isFlying ? FLY_SPEED : WALK_SPEED;
                    const targetVx = moveVec.x * speed;
                    const targetVz = moveVec.z * speed;
                    const accel = this.isOnGround ? 12 : 5;
                    this.playerVelocity.x += (targetVx - this.playerVelocity.x) * Math.min(1, accel * deltaTime);
                    this.playerVelocity.z += (targetVz - this.playerVelocity.z) * Math.min(1, accel * deltaTime);

                    // 重力
                    if (!this.isFlying) {
                        this.playerVelocity.y += GRAVITY * deltaTime;
                        if (this.playerVelocity.y < -30) this.playerVelocity.y = -30;
                    } else {
                        this.playerVelocity.y = 0;
                    }

                    // 尝试移动X
                    const newX = this.playerPosition.x + this.playerVelocity.x * deltaTime;
                    if (!this.checkCollision(new THREE.Vector3(newX, this.playerPosition.y, this.playerPosition.z))) {
                        this.playerPosition.x = newX;
                    } else {
                        this.playerVelocity.x = 0;
                    }

                    // 尝试移动Z
                    const newZ = this.playerPosition.z + this.playerVelocity.z * deltaTime;
                    if (!this.checkCollision(new THREE.Vector3(this.playerPosition.x, this.playerPosition.y, newZ))) {
                        this.playerPosition.z = newZ;
                    } else {
                        this.playerVelocity.z = 0;
                    }

                    // 尝试移动Y
                    const newY = this.playerPosition.y + this.playerVelocity.y * deltaTime;
                    if (!this.checkCollision(new THREE.Vector3(this.playerPosition.x, newY, this.playerPosition.z))) {
                        this.playerPosition.y = newY;
                        this.isOnGround = false;
                    } else {
                        if (this.playerVelocity.y < 0) {
                            this.isOnGround = true;
                            if (this.playerVelocity.y < -8) this.playSound('land');
                        }
                        this.playerVelocity.y = 0;
                    }

                    // 检查脚下
                    const footY = Math.floor(this.playerPosition.y - 0.01);
                    const footX = Math.floor(this.playerPosition.x);
                    const footZ = Math.floor(this.playerPosition.z);
                    if (this.world.isSolid(footX, footY, footZ)) {
                        this.isOnGround = true;
                    }

                    // 防止掉出世界底部
                    if (this.playerPosition.y < -10) {
                        this.playerPosition.y = 40;
                        this.playerVelocity.y = 0;
                    }

                    // 水检测
                    const headY = Math.floor(this.playerPosition.y + PLAYER_EYE_HEIGHT);
                    const headBlock = this.world.getBlock(Math.floor(this.playerPosition.x), headY, Math.floor(this
                        .playerPosition.z));
                    if (headBlock === BLOCK.WATER) {
                        this.playerVelocity.y = Math.max(this.playerVelocity.y, -5);
                    }
                }

                updateCamera() {
                    this.camera.position.set(
                        this.playerPosition.x,
                        this.playerPosition.y + PLAYER_EYE_HEIGHT,
                        this.playerPosition.z
                    );
                    this.camera.rotation.order = 'YXZ';
                    this.camera.rotation.y = this.playerYaw;
                    this.camera.rotation.x = this.playerPitch;
                }

                updateHighlight() {
                    const target = this.getTargetBlock();
                    if (target && target.blockId !== BLOCK.AIR && target.blockId !== BLOCK.WATER) {
                        this.highlightMesh.position.set(target.x + 0.5, target.y + 0.5, target.z + 0.5);
                        this.highlightMesh.visible = true;
                        this.raycastResult = target;
                    } else {
                        this.highlightMesh.visible = false;
                        this.raycastResult = null;
                    }
                }

                spawnBlockParticles(x, y, z, blockId) {
                    const colors = {
                        [BLOCK.GRASS]: 0x6B8E23,
                        [BLOCK.DIRT]: 0x8B6B3D,
                        [BLOCK.STONE]: 0x808080,
                        [BLOCK.LOG]: 0x8B5A2B,
                        [BLOCK.LEAVES]: 0x2E8B57,
                        [BLOCK.SAND]: 0xE8D8A0,
                        [BLOCK.BRICK]: 0x8B3A3A,
                        [BLOCK.PLANK]: 0xCD9B5A,
                    };
                    const color = colors[blockId] || 0xcccccc;
                    const positions = [];
                    for (let i = 0; i < 15; i++) {
                        positions.push(
                            x + (Math.random() - 0.5) * 0.6,
                            y + (Math.random() - 0.5) * 0.6,
                            z + (Math.random() - 0.5) * 0.6
                        );
                    }
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    const mat = new THREE.PointsMaterial({
                        color: color,
                        size: 0.06,
                        transparent: true,
                        opacity: 0.9,
                        sizeAttenuation: true,
                    });
                    const points = new THREE.Points(geo, mat);
                    points.userData = { lifetime: 0.5, age: 0, velocities: positions.map(() => ({
                        vx: (Math.random() - 0.5) * 2,
                        vy: Math.random() * 3,
                        vz: (Math.random() - 0.5) * 2,
                    })) };
                    this.scene.add(points);
                    this.particles.push(points);
                }

                updateParticles(deltaTime) {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        const p = this.particles[i];
                        p.userData.age += deltaTime;
                        if (p.userData.age >= p.userData.lifetime) {
                            this.scene.remove(p);
                            p.geometry.dispose();
                            p.material.dispose();
                            this.particles.splice(i, 1);
                            continue;
                        }
                        const pos = p.geometry.attributes.position;
                        const vels = p.userData.velocities;
                        for (let j = 0; j < pos.count; j++) {
                            pos.array[j * 3] += vels[j].vx * deltaTime;
                            pos.array[j * 3 + 1] += vels[j].vy * deltaTime;
                            pos.array[j * 3 + 2] += vels[j].vz * deltaTime;
                            vels[j].vy -= 9 * deltaTime;
                        }
                        pos.needsUpdate = true;
                        p.material.opacity = 0.9 * (1 - p.userData.age / p.userData.lifetime);
                    }
                }

                playSound(type) {
                    try {
                        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        const now = audioCtx.currentTime;
                        if (type === 'place' || type === 'break') {
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(type === 'place' ? 300 : 200, now);
                            osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                            gain.gain.setValueAtTime(0.15, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                            osc.start(now);
                            osc.stop(now + 0.1);
                        } else if (type === 'jump') {
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(200, now);
                            osc.frequency.exponentialRampToValueAtTime(400, now + 0.06);
                            gain.gain.setValueAtTime(0.1, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                            osc.start(now);
                            osc.stop(now + 0.08);
                        } else if (type === 'land') {
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(150, now);
                            osc.frequency.exponentialRampToValueAtTime(80, now + 0.06);
                            gain.gain.setValueAtTime(0.08, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                            osc.start(now);
                            osc.stop(now + 0.07);
                        }
                        setTimeout(() => audioCtx.close(), 200);
                    } catch (e) {}
                }

                gameLoop() {
                    requestAnimationFrame(() => this.gameLoop());

                    const now = performance.now();
                    const deltaTime = Math.min(0.05, (now - this.lastTime) / 1000);
                    this.lastTime = now;

                    // FPS计数
                    this.fpsCounter++;
                    this.fpsTime += deltaTime;
                    if (this.fpsTime >= 0.5) {
                        this.fpsDisplay = Math.round(this.fpsCounter / this.fpsTime);
                        this.fpsCounter = 0;
                        this.fpsTime = 0;
                        const fpsEl = document.getElementById('fps-counter');
                        if (fpsEl.style.display !== 'none') {
                            fpsEl.textContent = 'FPS: ' + this.fpsDisplay;
                        }
                    }

                    this.updatePlayer(deltaTime);
                    this.updateCamera();
                    this.updateHighlight();
                    this.updateChunks();
                    this.updateParticles(deltaTime);

                    // 云朵移动
                    if (this.cloudGroup) {
                        this.cloudGroup.position.x += deltaTime * 0.3;
                        if (this.cloudGroup.position.x > 60) this.cloudGroup.position.x = -60;
                    }

                    this.renderer.render(this.scene, this.camera);
                }
            }

            // ==================== 启动游戏 ====================
            window.addEventListener('DOMContentLoaded', () => {
                const game = new MinecraftMobile();
                window.game = game;

                // 显示FPS（长按屏幕三秒可切换）
                let pressTimer = null;
                document.addEventListener('touchstart', (e) => {
                    pressTimer = setTimeout(() => {
                        const fpsEl = document.getElementById('fps-counter');
                        const debugEl = document.getElementById('debug-info');
                        const show = fpsEl.style.display === 'none';
                        fpsEl.style.display = show ? 'block' : 'none';
                        debugEl.style.display = show ? 'block' : 'none';
                    }, 2000);
                }, { passive: true });
                document.addEventListener('touchend', () => {
                    if (pressTimer) clearTimeout(pressTimer);
                    pressTimer = null;
                }, { passive: true });
            });
        })();
    </script>
</body>
</html>
